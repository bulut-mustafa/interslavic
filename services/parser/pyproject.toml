[project]
name = "interslavic-parser"
version = "0.1.0"
description = "Thin UD parsing service for the Interslavic translator. Parses only; all transfer logic lives in the TypeScript engine."
requires-python = ">=3.11"
dependencies = [
    "stanza>=1.10",
    "simplemma>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[tool.uv]
package = false
